name: Update flake inputs

on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update flake inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update flake.lock
        run: nix flake update

      - name: Run tests to verify update
        run: nix develop --command cargo test

      - name: Create PR for flake update
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          title: "chore: update flake inputs"
          body: |
            Automated weekly update of flake inputs.
            
            This PR was created by the [update-flake](.github/workflows/update-flake.yml) workflow.
          branch: automated/flake-update
          commit-message: "chore: update flake inputs"
          labels: dependencies
