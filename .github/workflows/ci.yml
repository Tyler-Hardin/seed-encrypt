name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check formatting
        run: nix develop --command cargo fmt --all -- --check

      - name: Run clippy (default features)
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: Run clippy (check-history feature)
        run: nix develop --command cargo clippy --all-targets --no-default-features --features check-history -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run tests (default features - pledge)
        run: nix develop --command cargo test

      - name: Run tests (check-history only, no pledge)
        run: nix develop --command cargo test --no-default-features --features check-history

      - name: Run tests (no features)
        run: nix develop --command cargo test --no-default-features

      - name: Verify mutual exclusivity
        run: |
          nix develop --command bash -c 'cargo check --features pledge,check-history 2>&1 | grep -q "error: features"'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: nix build
