repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: nix develop --command cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (default features)
        entry: nix develop --command cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy-check-history
        name: cargo clippy (check-history)
        entry: nix develop --command cargo clippy --all-targets --no-default-features --features check-history -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]
