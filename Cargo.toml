[package]
name = "seed-encrypt"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
anyhow = { version = "1", features = ["backtrace"] }
argon2-kdf = "1.5"
bip32 = { version = "0.5.3", optional = true }
bip39 = { version = "2", features = ["all-languages", "zeroize"] }
bitcoin = { version = "0.32.8", features = ["serde"], optional = true }
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0", default-features = false, features = ["fuzzy-select", "password"] }
env_logger = "0.11"
humantime = "2.1"
libseccomp = { version = "0.4", optional = true }
log = "0.4"
rand = "0.10"
reqwest = { version = "0.13.2", features = ["json"], optional = true }
serde_json = { version = "1.0.149", optional = true }
sha2 = "0.10"
tokio = { version = "1.49.0", features = ["full"], optional = true }
zxcvbn = "3.1"

[features]
default = ["pledge"]
pledge = ["dep:libseccomp"]
check-history = ["dep:tokio", "dep:reqwest", "dep:serde_json", "dep:bitcoin", "dep:bip32"]
